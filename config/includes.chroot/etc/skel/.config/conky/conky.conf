conky.config = {
    alignment = 'top_right',
    background = true,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = '#e2e8f0',
    default_outline_color = '#00e5ff',
    default_shade_color = '#070d1a',
    double_buffer = true,
    draw_borders = true,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    font = 'Hack:size=9',
    gap_x = 24,
    gap_y = 54,
    minimum_width = 270,
    maximum_width = 270,
    net_avg_samples = 2,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 195,
    own_window_colour = '#070d1a',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    update_interval = 2.0,
    use_xft = true,
};

conky.text = [[
${color #00e5ff}◈ ATHERIUM-X // TELEMETRY HUD${color}
${color #1e3a5f}${hr 1}${color}
${color #38bdf8}CLOCK:${color}  ${alignr}${time %H:%M:%S}
${color #38bdf8}DATE:${color}   ${alignr}${time %Y-%m-%d}
${color #38bdf8}UPTIME:${color} ${alignr}${uptime_short}
${color #38bdf8}KERNEL:${color} ${alignr}${kernel}

${color #00e5ff}▸ PROCESSOR${color}
${color #38bdf8}CPU:${color} ${cpu cpu0}% ${alignr}${freq_g} GHz
${color #00e5ff}${cpubar cpu0 6,250}${color}

${color #00e5ff}▸ MEMORY & ZRAM${color}
${color #38bdf8}RAM:${color}  ${mem} / ${memmax} (${memperc}%)
${color #00e5ff}${membar 6,250}${color}
${color #38bdf8}ZRAM:${color} ${swap} / ${swapmax} (${swapperc}%)
${color #38bdf8}${swapbar 5,250}${color}

${color #00e5ff}▸ NETWORK${color}
${color #38bdf8}STATUS:${color} ${alignr}${execi 5 nmcli -t -f STATE general 2>/dev/null || echo offline}
${color #38bdf8}IP:${color}     ${alignr}${execi 5 hostname -I | awk '{print $1}'}

${color #00e5ff}▸ POWER${color}
${color #38bdf8}BATTERY:${color} ${alignr}${execi 15 acpi -b 2>/dev/null | cut -d',' -f2 || echo AC Power}
${color #1e3a5f}${hr 1}${color}
${color #64748b}Alt+Space: HUD | Ctrl+Alt+T: Term${color}
]];
