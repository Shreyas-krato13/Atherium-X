# Atherium-X picom compositor (dark glass + smooth fade + subtle cyan glow)
backend = "xrender";
vsync = true;

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.45;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-color = "#00b8d4";

inactive-opacity = 0.94;
active-opacity = 0.98;
frame-opacity = 0.95;

opacity-rule = [
    "92:class_g = 'Rofi'",
    "92:class_g = 'Tint2'",
    "94:class_g = 'Dunst'",
    "92:class_g = 'LXTerminal'"
];

shadow-exclude = [
    "class_g = 'Conky'",
    "class_g = 'Tint2'"
];
